<!--Page that let users to create a new account-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page for Personal Financial Management Application</title>
    <script src="signup.js" defer></script>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <h1>Page for Personal Financial Management Application</h1>
    <h2>Sign Up</h2>

    <!--Account Creation Form-->
    <form id="signup-form">
        <!--Asking for the input-->
        <input id="email-signup" type="email" placeholder="email" required>
        <input id="password-signup" type="password" placeholder="password" required>
        <button type="submit">Create Account</button>
    </form>
    <!--showing message based onthe web condition-->
    <p id="message"></p>
</body>
<footer>
    <!--Leaving the contact information-->
    <!--using placeholder link since this is a fake email address-->
    <p id="contact-info">If you have any troubles, send email to the following address: <a href="#personal.financial.management@rize.edu">personal.financial.management@rize.edu</a></p>
</footer>
</html>
